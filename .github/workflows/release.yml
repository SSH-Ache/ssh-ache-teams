name: release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build installers
# for every platform and attach them to a GitHub Release. The Homebrew cask is
# updated by .github/workflows/homebrew.yml once the release is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon + Intel in one universal build
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    # Held here rather than passed straight to the build: an EMPTY APPLE_CERTIFICATE
    # makes the macOS bundler try to import a zero-byte certificate and fail, so the
    # real names are only exported when the secrets actually exist.
    env:
      MAC_CERT: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential file

      - name: Install frontend dependencies
        run: npm ci

      # Inert until the six Apple secrets are set on the repo; then every macOS
      # build is signed with a Developer ID and notarised + stapled by the bundler.
      # Needs an Apple Developer Program membership ($99/yr).
      - name: Enable macOS signing and notarization
        if: matrix.platform == 'macos-latest' && env.MAC_CERT != ''
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SSH Ache Teams ${{ github.ref_name }}"
          releaseBody: "SSH Ache **Teams** — the commercial edition (E2EE team sharing, plans & billing). Download the installer for your platform below. macOS users can also `brew install --cask SSH-Ache/sshache/sshache-teams`. Looking for the individual, Apache-2.0 build you can use commercially with no permission? That's [SSH-Ache/ssh-ache](https://github.com/SSH-Ache/ssh-ache)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
